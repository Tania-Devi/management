<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Task Manager</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .container {
    background: white;
    padding: 20px;
    border-radius: 15px;
    width: 350px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }

  h2 {
    text-align: center;
    margin-bottom: 15px;
  }

  .input-box {
    display: flex;
    gap: 5px;
  }

  input {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  button {
    padding: 8px 12px;
    border: none;
    background: #667eea;
    color: white;
    border-radius: 8px;
    cursor: pointer;
  }

  button:hover {
    background: #5a67d8;
  }

  ul {
    list-style: none;
    padding: 0;
    margin-top: 15px;
  }

  li {
    background: #f4f4f4;
    padding: 10px;
    margin-top: 8px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .delete {
    background: red;
    color: white;
    padding: 5px 8px;
    border-radius: 5px;
    cursor: pointer;
  }

  .completed {
    text-decoration: line-through;
    color: gray;
  }
</style>
</head>

<body>

<div class="container">
  <h2>📘 Task Manager</h2>

  <div class="input-box">
    <input type="text" id="taskInput" placeholder="Enter task">
    <button id="addBtn">Add</button>
  </div>

  <ul id="taskList"></ul>
</div>

<script>
  let tasks = [];

  // Load tasks
  function loadTasks() {
    const data = localStorage.getItem("tasks");
    if (data) {
      tasks = JSON.parse(data);
    }
  }

  // Save tasks
  function saveTasks() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }

  // Display tasks
  function displayTasks() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    tasks.forEach((task, index) => {
      const li = document.createElement("li");

      const text = document.createElement("span");
      text.innerText = task.text;

      if (task.done) text.classList.add("completed");

      text.onclick = () => toggleTask(index);

      const del = document.createElement("span");
      del.innerText = "X";
      del.className = "delete";
      del.onclick = () => deleteTask(index);

      li.appendChild(text);
      li.appendChild(del);

      list.appendChild(li);
    });
  }

  // Add task
  document.getElementById("addBtn").addEventListener("click", addTask);

  function addTask() {
    const input = document.getElementById("taskInput");
    const value = input.value.trim();

    if (value === "") {
      alert("Enter a task!");
      return;
    }

    tasks.push({ text: value, done: false });
    input.value = "";

    saveTasks();
    displayTasks();
  }

  // Delete task
  function deleteTask(index) {
    tasks.splice(index, 1);
    saveTasks();
    displayTasks();
  }

  // Toggle complete
  function toggleTask(index) {
    tasks[index].done = !tasks[index].done;
    saveTasks();
    displayTasks();
  }

  // Initialize
  loadTasks();
  displayTasks();
</script>

</body>
</html>
